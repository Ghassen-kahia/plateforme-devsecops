# Promotion d'une version de dev vers prod (déclenchement manuel = décision humaine).
# Ne reconstruit rien : la MÊME image (même tag immuable, déjà scannée) est promue.
name: Promotion vers prod

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à promouvoir (vide = tag actuellement déployé en dev)"
        required: false
        type: string

permissions: {}

concurrency:
  group: promote-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Déterminer et valider le tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(yq '.image.tag' k8s/environments/dev/values.yaml)}"
          # Seuls les tags produits par la CI (sha-<12 hex>) sont acceptés : pas d'injection
          [[ "$tag" =~ ^sha-[0-9a-f]{12}$ ]] || { echo "Tag invalide : $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Écrire le tag dans l'état désiré de prod
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          registry="$(yq '.image.registry' k8s/environments/dev/values.yaml)"
          yq -i ".image.registry = \"${registry}\" | .image.tag = \"${TAG}\"" k8s/environments/prod/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/environments/prod/values.yaml
          git commit -m "chore(gitops): promouvoir ${TAG} en prod (par ${GITHUB_ACTOR})"
          git push origin HEAD:main
