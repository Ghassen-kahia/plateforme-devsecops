# Compte de service dédié, sans jeton monté : l'application n'appelle pas l'API Kubernetes.
# Un pod compromis ne peut donc pas utiliser de jeton pour interroger le cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plateforme.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
automountServiceAccountToken: false
