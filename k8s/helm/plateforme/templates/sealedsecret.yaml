{{- with .Values.database.sealedPassword }}
# Mot de passe de la base, CHIFFRÉ avec la clé publique du contrôleur Sealed Secrets.
# Seul le contrôleur du cluster (clé privée) peut le déchiffrer ; portée « strict » : le texte chiffré
# n'est valable que pour ce nom ET ce namespace (impossible de le rejouer ailleurs).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $.Values.database.existingSecret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "plateforme.labels" $ | nindent 4 }}
spec:
  encryptedData:
    password: {{ . | quote }}
  template:
    metadata:
      name: {{ $.Values.database.existingSecret }}
      namespace: {{ $.Release.Namespace }}
    type: Opaque
{{- end }}
