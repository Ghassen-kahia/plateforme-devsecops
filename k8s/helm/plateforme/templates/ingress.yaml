{{- if .Values.ingress.enabled }}
# Point d'entrée HTTP via Traefik (contrôleur Ingress fourni par k3s).
# Le frontend relaie lui-même /api vers l'API : une seule route est nécessaire.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "plateforme.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "plateforme.frontendName" . }}
                port:
                  name: http
{{- end }}
