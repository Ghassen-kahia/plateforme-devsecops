# État désiré de l'environnement prod — source de vérité GitOps.
# Promotion : le tag validé en dev est recopié ici par le workflow « promote » (déclenchement manuel).
image:
  registry: ""
  tag: "0.1.0"

ingress:
  host: plateforme.local
api:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
frontend:
  replicas: 2
