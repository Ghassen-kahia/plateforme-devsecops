[defaults]
inventory = inventory/local.yml
roles_path = roles
# Collections du projet installées localement (requirements.yml), prioritaires sur celles du système
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
stdout_callback = yaml
# Vérification de la clé d'hôte SSH conservée (sécurité contre l'usurpation de serveur)
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become_method = sudo
