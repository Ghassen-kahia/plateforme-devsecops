- name: Créer les répertoires de configuration et d'audit
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/rancher/k3s
    - "{{ k3s_audit_log_dir }}"

- name: Déployer la configuration k3s
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Redémarrer k3s

- name: Déployer la politique d'audit
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /etc/rancher/k3s/audit-policy.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Redémarrer k3s

- name: Vérifier la version de k3s installée
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false
  # Lecture seule : exécutée aussi en mode --check (sinon la variable serait vide)
  check_mode: false

- name: Télécharger le script d'installation k3s (somme SHA-256 vérifiée)
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
    dest: /usr/local/src/k3s-install.sh
    checksum: "sha256:{{ k3s_install_script_sha256 }}"
    owner: root
    group: root
    mode: "0700"
  when: k3s_version not in (k3s_installed.stdout | default(''))

- name: Installer k3s (le script vérifie la somme SHA-256 du binaire)
  ansible.builtin.command: /usr/local/src/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_SKIP_ENABLE: "false"
    # Pas de liens kubectl/crictl vers le binaire k3s : utilisé par un non-root, `k3s kubectl`
    # extrait ~250 Mo dans ~/.rancher. On utilise le kubectl officiel (scripts/install.sh k8s)
    # et `sudo k3s crictl` pour le débogage du runtime.
    INSTALL_K3S_SYMLINK: "skip"
  when: k3s_version not in (k3s_installed.stdout | default(''))
  changed_when: true

- name: Lister les liens créés par une installation antérieure de k3s
  ansible.builtin.stat:
    path: "/usr/local/bin/{{ item }}"
  loop: [kubectl, crictl, ctr]
  register: k3s_symlinks

- name: Retirer les liens kubectl/crictl/ctr pointant vers k3s
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ k3s_symlinks.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.islnk | default(false) and item.stat.lnk_target == 'k3s'

- name: Attendre que le nœud soit Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false
  when: not ansible_check_mode

- name: Créer ~/.kube pour l'utilisateur
  ansible.builtin.file:
    path: "~{{ k3s_kubeconfig_user }}/.kube"
    state: directory
    owner: "{{ k3s_kubeconfig_user }}"
    group: "{{ k3s_kubeconfig_user }}"
    mode: "0700"

- name: Copier le kubeconfig pour l'utilisateur (0600)
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "~{{ k3s_kubeconfig_user }}/.kube/config"
    remote_src: true
    owner: "{{ k3s_kubeconfig_user }}"
    group: "{{ k3s_kubeconfig_user }}"
    mode: "0600"
  when: not ansible_check_mode
