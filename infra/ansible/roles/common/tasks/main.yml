- name: Mettre à jour l'index APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  # Rafraîchir le cache (s'il a plus d'une heure) ne change pas la configuration du système :
  # sans cela, chaque exécution espacée d'une heure apparaîtrait faussement « changed ».
  changed_when: false

- name: Appliquer toutes les mises à jour disponibles
  ansible.builtin.apt:
    upgrade: safe
  when: common_full_upgrade | bool

- name: Installer les paquets de base
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Activer les mises à jour de sécurité automatiques
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Appliquer les paramètres noyau (sysctl)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-plateforme.conf
    reload: true
  loop: "{{ common_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
